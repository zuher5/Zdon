# Project-wide Gradle settings for Zdon.

# JVM arguments for the Gradle daemon. Capped to fit the 7.4 GiB dev machine;
# a larger heap caused OOM freezes during R8/lintVital once KSP + Compose workers
# were in flight.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=4

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX + Kotlin defaults.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
