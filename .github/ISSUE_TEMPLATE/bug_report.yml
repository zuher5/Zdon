name: Bug Report
description: Report something that is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please search existing
        issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Paste URL '...'
        3. Tap Download
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.0.1"
    validations:
      required: true

  - type: dropdown
    id: apk-variant
    attributes:
      label: APK variant
      options:
        - arm64-v8a
        - armeabi-v7a
        - x86_64
        - x86
        - universal
        - Built from source
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Pixel 7, Xiaomi 13, ..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If you can, attach logcat output:
        `adb logcat | grep -i zdon`
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: I am running the latest release
          required: true
        - label: This is not an upstream yt-dlp issue (the same URL works elsewhere)
