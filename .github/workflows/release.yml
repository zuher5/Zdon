name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ZDON_KEYSTORE must be the *base64-encoded* contents of a JKS keystore.
      - name: Configure release signing
        if: ${{ secrets.ZDON_KEYSTORE != '' }}
        env:
          ZDON_KEYSTORE: ${{ secrets.ZDON_KEYSTORE }}
        run: |
          echo "$ZDON_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/zdon-release.keystore"
          echo "ZDON_KEYSTORE_PATH=$RUNNER_TEMP/zdon-release.keystore" >> "$GITHUB_ENV"

      - name: Build release
        run: ./gradlew assembleRelease --stacktrace
        env:
          ZDON_STORE_PASSWORD: ${{ secrets.ZDON_STORE_PASSWORD }}
          ZDON_KEY_ALIAS: ${{ secrets.ZDON_KEY_ALIAS }}
          ZDON_KEY_PASSWORD: ${{ secrets.ZDON_KEY_PASSWORD }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
